# PIPELINE DEFINITION
# Name: iris-pipeline
components:
  comp-load-iris-data:
    executorLabel: exec-load-iris-data
    outputDefinitions:
      artifacts:
        test_dataset:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        train_dataset:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-load-iris-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_iris_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_iris_data(train_dataset: dsl.OutputPath(\"train_dataset\"\
          )\n                   , test_dataset: dsl.OutputPath(\"test_dataset\")):\n\
          \   from sklearn.datasets import load_iris\n   from sklearn.model_selection\
          \ import train_test_split\n   import pickle\n\n   iris_data = load_iris()\n\
          \n   X_data = iris_data.get('data')\n   y_data = iris_data.get('target')\n\
          \n   X_train, X_test, y_train, y_test = train_test_split(X_data, y_data,\
          \ test_size=0.1)\n\n   # pickle X_train, y_train, X_test, y_test\n   with\
          \ (open(train_dataset, 'wb')) as f:\n      pickle.dump((X_train, y_train),\
          \ f)\n\n   with (open(test_dataset, 'wb')) as f:\n      pickle.dump((X_test,y_test),\
          \ f)\n\n"
        image: python:3.12
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'scikit-learn'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(train_dataset: dsl.InputPath('train_dataset')\n \
          \               , model: dsl.OutputPath('model')):\n   from sklearn import\
          \ svm\n   import pickle\n\n   with (open(train_dataset, 'rb')) as f:\n \
          \     #pickle.dump((X_train, y_train), f)\n      X_train, y_train = pickle.load(f)\n\
          \n   # training in here, we write out the model\n\n"
        image: python:3.12
pipelineInfo:
  name: iris-pipeline
root:
  dag:
    tasks:
      load-iris-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-iris-data
        taskInfo:
          name: load-iris-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - load-iris-data
        inputs:
          artifacts:
            train_dataset:
              taskOutputArtifact:
                outputArtifactKey: train_dataset
                producerTask: load-iris-data
        taskInfo:
          name: train-model
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
